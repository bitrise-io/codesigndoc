format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  test:
    steps:
    - script@1:
        title: yamlfmt
        inputs:
        - content: |-
            #!/bin/env bash
            set -eo pipefail
            set -x
            go run github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0 -lint -conf .ymlfmt -match_type doublestar -exclude "_tmp/**,.bitrise.secrets.yml,.git/**,.github/**,vendor/**" '**/*.yml'
    - script@1:
        title: golangci-lint
        inputs:
        - content: |-
            #!/bin/env bash
            set -eo pipefail
            set -x
            curl -sSfL https://golangci-lint.run/install.sh | sh -s v2.13.2
            ./bin/golangci-lint run --timeout 5m --color always --config .golangci.yml
    - script@1:
        title: go build & test
        inputs:
        - content: |-
            #!/bin/env bash
            set -exo pipefail

            go build ./...
            go test -v ./...

  create-release:
    description: Creates Darwin binaries, then publishes a GitHub release
    envs:
    - GITHUB_TOKEN: $GIT_BOT_USER_ACCESS_TOKEN # Goreleaser expects this env var
    steps:
    - script:
        title: Goreleaser (create binaries + publish to GH)
        deps:
          brew:
          - name: goreleaser
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -ex
            goreleaser release

  update-wrapper-versions:
    description: Updates the versions in scripts (see README)
    steps:
    - script:
        title: Creating release install_wrap
        inputs:
        - content: |-
            cd ./_scripts
            go run update_wrapper_versions.go
            cd -

  test-binary-build:
    description: Tests the release build process by creating a snapshot release (without publishing)
    steps:
    - script:
        title: Goreleaser (create snapshot binaries)
        deps:
          brew:
          - name: goreleaser
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            goreleaser release --snapshot --rm-dist
